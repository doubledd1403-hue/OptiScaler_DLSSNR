name: Chimera DXVK V15.1 Motion-Safe Temporal Shadows

on:
  push:
    branches:
      - chimera-amd-nr
    paths:
      - '.github/workflows/chimera_dxvk_motion_safe_temporal_v15_1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dxvk:
    name: Build Chimera V15.1 motion-safe temporal shadows
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang python python-yaml gzip

      - name: Clone Chimera source and pinned DXVK
        run: |
          git clone --branch chimera-amd-nr --single-branch https://github.com/doubledd1403-hue/OptiScaler_DLSSNR.git chimera-source
          git clone https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git checkout d7ac2580aa274a14a500e74edbe4ec6aae250e4a
          git submodule update --init --recursive

      - name: Reuse complete V15 temporal foundation
        run: |
          python3 - <<'PYIN'
          import yaml
          from pathlib import Path

          wf = yaml.safe_load(
              Path('chimera-source/.github/workflows/chimera_dxvk_temporal_lighting_v15.yml').read_text())
          job = next(iter(wf['jobs'].values()))

          for step_name, out_path in [
              ('Reuse proven V1 through V13.1 chain', '/tmp/v151_inherit_base.sh'),
              ('Add V15 persistent temporal lighting history', '/tmp/v151_inherit_v15.sh'),
          ]:
              step = next(s for s in job['steps'] if s.get('name') == step_name)
              Path(out_path).write_text(step['run'])
          PYIN

          bash /tmp/v151_inherit_base.sh
          (
            cd dxvk
            bash /tmp/v151_inherit_v15.sh
          )

          grep -q 'CHIMERA_LIGHTING_V15_TEMPORAL_HISTORY' dxvk/src/dxvk/shaders/dxvk_present_common.glsl
          grep -q 'prepareChimeraTemporalHistory' dxvk/src/dxvk/dxvk_swapchain_blitter.cpp

      - name: Add V15.1 motion-safe temporal reuse and shadow field
        working-directory: dxvk
        run: |
          echo '' | base64 -d | gzip -d > /tmp/chimera_v15_1_patch.py
          python3 /tmp/chimera_v15_1_patch.py
          grep -n 'CHIMERA_LIGHTING_V15_1_MOTION_SAFE_SHADOWS' src/dxvk/shaders/dxvk_present_common.glsl
          grep -n 'chimera_shadow_field_v151' src/dxvk/shaders/dxvk_present_common.glsl
          grep -n 'pixel_phase' src/dxvk/shaders/dxvk_present_common.glsl

      - name: Build DXVK x64 and x32
        working-directory: dxvk
        run: |
          export VERSION_NAME="chimera-dxvk-motion-safe-temporal-v15-1"
          ./package-release.sh "$VERSION_NAME" build --no-package

      - name: Verify and package runtime
        working-directory: dxvk
        run: |
          set -euxo pipefail
          root="build/dxvk-chimera-dxvk-motion-safe-temporal-v15-1"
          test -f "$root/x64/d3d11.dll"
          test -f "$root/x64/dxgi.dll"
          test -f "$root/x32/d3d11.dll"
          test -f "$root/x32/dxgi.dll"
          grep -q 'CHIMERA_LIGHTING_V15_1_MOTION_SAFE_SHADOWS' src/dxvk/shaders/dxvk_present_common.glsl
          grep -q 'CHIMERA_LIGHTING_V15_TEMPORAL_HISTORY' src/dxvk/shaders/dxvk_present_common.glsl
          mkdir -p ../runtime_bundle
          cp "$root/x64/d3d11.dll" ../runtime_bundle/d3d11_64.dll
          cp "$root/x64/dxgi.dll"  ../runtime_bundle/dxgi_64.dll
          cp "$root/x32/d3d11.dll" ../runtime_bundle/d3d11_32.dll
          cp "$root/x32/dxgi.dll"  ../runtime_bundle/dxgi_32.dll
          cp LICENSE ../runtime_bundle/DXVK-LICENSE
          sha256sum ../runtime_bundle/*.dll

      - name: Upload DXVK runtime
        uses: actions/upload-artifact@v7
        with:
          name: chimera-dxvk-motion-safe-temporal-v15-1-runtime
          path: runtime_bundle
          compression-level: 0
          if-no-files-found: error
