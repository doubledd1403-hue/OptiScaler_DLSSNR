name: Chimera DXVK V11.2 Composite Visibility FIX

on:
  push:
    branches:
      - chimera-amd-nr
    paths:
      - '.github/workflows/chimera_dxvk_composite_visibility_v11_2_fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dxvk:
    name: Build Chimera V11.2 visible bounced-colour composite
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang python python-yaml

      - name: Clone Chimera source and pinned DXVK
        run: |
          git clone --branch chimera-amd-nr --single-branch https://github.com/doubledd1403-hue/OptiScaler_DLSSNR.git chimera-source
          git clone https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git checkout d7ac2580aa274a14a500e74edbe4ec6aae250e4a
          git submodule update --init --recursive

      - name: Prepare and apply inherited V1 through V11.1 patches
        run: |
          python3 - <<'PYIN'
          import yaml
          from pathlib import Path

          wf = yaml.safe_load(Path('chimera-source/.github/workflows/chimera_dxvk_radiance_diag_v11_1.yml').read_text())
          job = next(iter(wf['jobs'].values()))
          names = [
            ('Prepare inherited V1 through V10.1 patches', '/tmp/prepare.sh'),
            ('Reuse V11 hit-UV indirect colour', '/tmp/v11.sh'),
            ('Add V11.1 zero-rays and radiance diagnostics', '/tmp/v11_1.sh'),
          ]
          for name, out in names:
              step = next(s for s in job['steps'] if s.get('name') == name)
              Path(out).write_text(step['run'])
          PYIN

          bash /tmp/prepare.sh

          # V1-V10.1 patch scripts expect to run inside the DXVK checkout.
          (
            cd dxvk
            set -eux
            for f in /tmp/chimera_patch_*.sh; do bash "$f"; done
          )

          # The inherited V11 wrapper itself expects repository-root cwd:
          # it reads chimera-source/... and then enters dxvk internally.
          bash /tmp/v11.sh

          # The V11.1 diagnostics patch originally has working-directory: dxvk.
          (
            cd dxvk
            bash /tmp/v11_1.sh
          )

      - name: Add V11.2 visible composite
        working-directory: dxvk
        run: |
          echo '' | base64 -d > /tmp/chimera_v11_2_patch.py
          python3 /tmp/chimera_v11_2_patch.py
          grep -n 'CHIMERA_LIGHTING_V11_2_COMPOSITE_VISIBILITY' src/dxvk/shaders/dxvk_present_common.glsl
          grep -n 'accepted_hits' src/dxvk/shaders/dxvk_present_common.glsl

      - name: Build DXVK x64 and x32
        working-directory: dxvk
        run: |
          export VERSION_NAME="chimera-dxvk-composite-visibility-v11-2"
          ./package-release.sh "$VERSION_NAME" build --no-package

      - name: Verify and package runtime
        working-directory: dxvk
        run: |
          set -euxo pipefail
          root="build/dxvk-chimera-dxvk-composite-visibility-v11-2"
          test -f "$root/x64/d3d11.dll"
          test -f "$root/x64/dxgi.dll"
          test -f "$root/x32/d3d11.dll"
          test -f "$root/x32/dxgi.dll"
          mkdir -p ../runtime_bundle
          cp "$root/x64/d3d11.dll" ../runtime_bundle/d3d11_64.dll
          cp "$root/x64/dxgi.dll"  ../runtime_bundle/dxgi_64.dll
          cp "$root/x32/d3d11.dll" ../runtime_bundle/d3d11_32.dll
          cp "$root/x32/dxgi.dll"  ../runtime_bundle/dxgi_32.dll
          cp LICENSE ../runtime_bundle/DXVK-LICENSE
          sha256sum ../runtime_bundle/*.dll

      - name: Upload DXVK runtime
        uses: actions/upload-artifact@v7
        with:
          name: chimera-dxvk-composite-visibility-v11-2-runtime
          path: runtime_bundle
          compression-level: 0
          if-no-files-found: error
