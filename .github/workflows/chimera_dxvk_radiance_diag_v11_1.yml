name: Chimera DXVK V11.1 Radiance Diagnostics

on:
  push:
    branches:
      - chimera-amd-nr
    paths:
      - '.github/workflows/chimera_dxvk_radiance_diag_v11_1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dxvk:
    name: Build Chimera V11.1 radiance diagnostics
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang python python-yaml

      - name: Clone Chimera source and pinned DXVK
        run: |
          git clone --branch chimera-amd-nr --single-branch https://github.com/doubledd1403-hue/OptiScaler_DLSSNR.git chimera-source
          git clone https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git checkout d7ac2580aa274a14a500e74edbe4ec6aae250e4a
          git submodule update --init --recursive

      - name: Prepare inherited V1 through V10.1 patches
        run: |
          python3 - <<'PYIN'
          import yaml
          from pathlib import Path

          wf = yaml.safe_load(Path('chimera-source/.github/workflows/chimera_dxvk_indirect_colour_v11.yml').read_text())
          job = next(iter(wf['jobs'].values()))
          prep = next(s for s in job['steps'] if s.get('name') == 'Prepare inherited Chimera patches')
          Path('/tmp/chimera_prepare.sh').write_text(prep['run'])
          PYIN
          bash /tmp/chimera_prepare.sh

      - name: Apply V1 through V10.1 patches
        working-directory: dxvk
        run: |
          set -eux
          for f in /tmp/chimera_patch_*.sh; do
            echo "==> $f"
            bash "$f"
          done

      - name: Reuse V11 hit-UV indirect colour
        run: |
          python3 - <<'PYIN'
          import yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('chimera-source/.github/workflows/chimera_dxvk_indirect_colour_v11.yml').read_text())
          job = next(iter(wf['jobs'].values()))
          step = next(s for s in job['steps'] if s.get('name') == 'Add V11 hit-UV indirect colour')
          Path('/tmp/chimera_v11.sh').write_text(step['run'])
          PYIN
          cd dxvk
          bash /tmp/chimera_v11.sh

      - name: Add V11.1 zero-rays and radiance diagnostics
        working-directory: dxvk
        run: |
          echo '' | base64 -d > /tmp/chimera_v11_1_patch.py
          python3 /tmp/chimera_v11_1_patch.py
          grep -n 'CHIMERA_LIGHTING_V11_1_DIAGNOSTICS' src/dxvk/shaders/dxvk_present_common.glsl
          grep -n 'chimera_debug_mode' src/dxvk/shaders/dxvk_present_common.glsl

      - name: Build DXVK x64 and x32
        working-directory: dxvk
        run: |
          export VERSION_NAME="chimera-dxvk-radiance-diag-v11-1"
          ./package-release.sh "$VERSION_NAME" build --no-package

      - name: Verify and package runtime
        working-directory: dxvk
        run: |
          set -euxo pipefail
          root="build/dxvk-chimera-dxvk-radiance-diag-v11-1"
          test -f "$root/x64/d3d11.dll"
          test -f "$root/x64/dxgi.dll"
          test -f "$root/x32/d3d11.dll"
          test -f "$root/x32/dxgi.dll"
          python3 - <<'PYIN'
          from pathlib import Path
          p = Path('build/dxvk-chimera-dxvk-radiance-diag-v11-1/x64/d3d11.dll')
          data = p.read_bytes()
          for marker in (b'CHIMERA_DXVK_PROBE_V1', b'CHIMERA_DSV_CREATE_V1', b'CHIMERA_PROJECTION_V8'):
              if marker not in data:
                  raise SystemExit(f'Missing retained binary marker: {marker!r}')
          print('V11.1 retained runtime marker verification: PASS')
          PYIN
          mkdir -p ../runtime_bundle
          cp "$root/x64/d3d11.dll" ../runtime_bundle/d3d11_64.dll
          cp "$root/x64/dxgi.dll"  ../runtime_bundle/dxgi_64.dll
          cp "$root/x32/d3d11.dll" ../runtime_bundle/d3d11_32.dll
          cp "$root/x32/dxgi.dll"  ../runtime_bundle/dxgi_32.dll
          cp LICENSE ../runtime_bundle/DXVK-LICENSE
          sha256sum ../runtime_bundle/*.dll

      - name: Upload DXVK runtime
        uses: actions/upload-artifact@v7
        with:
          name: chimera-dxvk-radiance-diag-v11-1-runtime
          path: runtime_bundle
          compression-level: 0
          if-no-files-found: error
