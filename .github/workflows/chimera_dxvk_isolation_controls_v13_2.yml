name: Chimera DXVK V13.2 Isolation Controls

on:
  push:
    branches:
      - chimera-amd-nr
    paths:
      - '.github/workflows/chimera_dxvk_isolation_controls_v13_2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dxvk:
    name: Build Chimera V13.2 isolation controls
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang python python-yaml

      - name: Clone Chimera source and pinned DXVK
        run: |
          git clone --branch chimera-amd-nr --single-branch https://github.com/doubledd1403-hue/OptiScaler_DLSSNR.git chimera-source
          git clone https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git checkout d7ac2580aa274a14a500e74edbe4ec6aae250e4a
          git submodule update --init --recursive

      - name: Reuse proven V1 through V13.1 chain
        run: |
          python3 - <<'PYIN'
          import yaml
          from pathlib import Path

          wf = yaml.safe_load(
              Path('chimera-source/.github/workflows/chimera_dxvk_reconstruction_shadows_v13_1.yml').read_text())
          job = next(iter(wf['jobs'].values()))

          steps = [
            ('Reuse proven V1 through V13 chain', '/tmp/v132_inherit_v13.sh'),
            ('Add V13.1 reconstruction and contact-shadow foundation', '/tmp/v132_inherit_v131.sh'),
          ]

          for step_name, out_path in steps:
              step = next(s for s in job['steps'] if s.get('name') == step_name)
              Path(out_path).write_text(step['run'])
          PYIN

          bash /tmp/v132_inherit_v13.sh
          (
            cd dxvk
            bash /tmp/v132_inherit_v131.sh
          )

          grep -q 'CHIMERA_LIGHTING_V13_1_RECON_SHADOWS' dxvk/src/dxvk/shaders/dxvk_present_common.glsl
          grep -q 'CHIMERA_DEPTH_STABILITY_V12_1' dxvk/src/d3d11/d3d11_context.cpp

      - name: Add V13.2 bounce shadow and denoise isolation controls
        working-directory: dxvk
        run: |
          echo '' | base64 -d > /tmp/chimera_v13_2_patch.py
          python3 /tmp/chimera_v13_2_patch.py

          grep -n 'CHIMERA_LIGHTING_V13_2_ISOLATION_CONTROLS' src/dxvk/shaders/dxvk_present_common.glsl
          grep -n 'chimera_debug_mode == 6u' src/dxvk/shaders/dxvk_present_common.glsl
          grep -n 'chimera_debug_mode == 7u' src/dxvk/shaders/dxvk_present_common.glsl
          grep -n 'chimera_debug_mode == 8u' src/dxvk/shaders/dxvk_present_common.glsl

      - name: Build DXVK x64 and x32
        working-directory: dxvk
        run: |
          export VERSION_NAME="chimera-dxvk-isolation-controls-v13-2"
          ./package-release.sh "$VERSION_NAME" build --no-package

      - name: Verify and package runtime
        working-directory: dxvk
        run: |
          set -euxo pipefail
          root="build/dxvk-chimera-dxvk-isolation-controls-v13-2"
          test -f "$root/x64/d3d11.dll"
          test -f "$root/x64/dxgi.dll"
          test -f "$root/x32/d3d11.dll"
          test -f "$root/x32/dxgi.dll"

          grep -q 'CHIMERA_LIGHTING_V13_2_ISOLATION_CONTROLS' src/dxvk/shaders/dxvk_present_common.glsl
          grep -q 'chimera_debug_mode == 6u' src/dxvk/shaders/dxvk_present_common.glsl
          grep -q 'chimera_debug_mode == 7u' src/dxvk/shaders/dxvk_present_common.glsl
          grep -q 'chimera_debug_mode == 8u' src/dxvk/shaders/dxvk_present_common.glsl

          mkdir -p ../runtime_bundle
          cp "$root/x64/d3d11.dll" ../runtime_bundle/d3d11_64.dll
          cp "$root/x64/dxgi.dll"  ../runtime_bundle/dxgi_64.dll
          cp "$root/x32/d3d11.dll" ../runtime_bundle/d3d11_32.dll
          cp "$root/x32/dxgi.dll"  ../runtime_bundle/dxgi_32.dll
          cp LICENSE ../runtime_bundle/DXVK-LICENSE
          sha256sum ../runtime_bundle/*.dll

      - name: Upload DXVK runtime
        uses: actions/upload-artifact@v7
        with:
          name: chimera-dxvk-isolation-controls-v13-2-runtime
          path: runtime_bundle
          compression-level: 0
          if-no-files-found: error
