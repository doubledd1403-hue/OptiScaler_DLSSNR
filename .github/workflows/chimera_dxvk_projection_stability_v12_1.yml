name: Chimera DXVK V12.1 Projection Stability

on:
  push:
    branches:
      - chimera-amd-nr
    paths:
      - '.github/workflows/chimera_dxvk_projection_stability_v12_1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dxvk:
    name: Build Chimera V12.1 stable exact-depth runtime
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang python python-yaml

      - name: Clone Chimera source and pinned DXVK
        run: |
          git clone --branch chimera-amd-nr --single-branch https://github.com/doubledd1403-hue/OptiScaler_DLSSNR.git chimera-source
          git clone https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git checkout d7ac2580aa274a14a500e74edbe4ec6aae250e4a
          git submodule update --init --recursive

      - name: Reuse proven V1 through V12 FIX4 chain
        run: |
          python3 - <<'PYIN'
          import yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('chimera-source/.github/workflows/chimera_dxvk_exact_depth_v12_fix4.yml').read_text())
          job = next(iter(wf['jobs'].values()))
          wanted = {
            'base': 'Reuse proven V1 through V11.2 renderer chain',
            'prepare': 'Prepare corrected V12 patch',
            'v12': 'Add V12 exact depth reconstruction and diagnostics FIX4',
          }
          for key, name in wanted.items():
            step = next(s for s in job['steps'] if s.get('name') == name)
            Path(f'/tmp/chimera_{key}.sh').write_text(step['run'])
          PYIN
          bash /tmp/chimera_base.sh
          bash /tmp/chimera_prepare.sh
          (cd dxvk && bash /tmp/chimera_v12.sh)

      - name: Add V12.1 atomic projection + last-known-good + hysteresis
        working-directory: dxvk
        run: |
          python3 - <<'PYIN'
          from pathlib import Path
          import base64, zlib
          payload = ''
          Path('/tmp/chimera_v12_1_patch.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PYIN
          python3 /tmp/chimera_v12_1_patch.py
          grep -n 'CHIMERA_DEPTH_STABILITY_V12_1' src/d3d11/d3d11_context.cpp
          grep -n 'MoveFileExW' src/d3d11/d3d11_context.cpp
          grep -n 'bool complete = sawValid' src/dxvk/dxvk_swapchain_blitter.cpp

      - name: Build DXVK x64 and x32
        working-directory: dxvk
        run: |
          export VERSION_NAME="chimera-dxvk-projection-stability-v12-1"
          ./package-release.sh "$VERSION_NAME" build --no-package

      - name: Verify and package runtime
        working-directory: dxvk
        run: |
          set -euxo pipefail
          root="build/dxvk-chimera-dxvk-projection-stability-v12-1"
          test -f "$root/x64/d3d11.dll"
          test -f "$root/x64/dxgi.dll"
          test -f "$root/x32/d3d11.dll"
          test -f "$root/x32/dxgi.dll"

          python3 - <<'PYIN'
          from pathlib import Path
          p = Path('build/dxvk-chimera-dxvk-projection-stability-v12-1/x64/d3d11.dll')
          data = p.read_bytes()
          for marker in (
              b'CHIMERA_DXVK_PROBE_V1',
              b'CHIMERA_DSV_CREATE_V1',
              b'CHIMERA_PROJECTION_V8',
              b'CHIMERA_DEPTH_FOUNDATION_V12',
              b'CHIMERA_DEPTH_STABILITY_V12_1',
          ):
              if marker not in data:
                  raise SystemExit(f'Missing retained binary marker: {marker!r}')
          print('V12.1 retained runtime marker verification: PASS')
          PYIN

          mkdir -p ../runtime_bundle
          cp "$root/x64/d3d11.dll" ../runtime_bundle/d3d11_64.dll
          cp "$root/x64/dxgi.dll"  ../runtime_bundle/dxgi_64.dll
          cp "$root/x32/d3d11.dll" ../runtime_bundle/d3d11_32.dll
          cp "$root/x32/dxgi.dll"  ../runtime_bundle/dxgi_32.dll
          cp LICENSE ../runtime_bundle/DXVK-LICENSE
          sha256sum ../runtime_bundle/*.dll

      - name: Upload DXVK runtime
        uses: actions/upload-artifact@v7
        with:
          name: chimera-dxvk-projection-stability-v12-1-runtime
          path: runtime_bundle
          compression-level: 0
          if-no-files-found: error
