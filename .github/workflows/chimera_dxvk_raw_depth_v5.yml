name: Chimera DXVK Raw Depth v5

on:
  push:
    branches:
      - chimera-amd-nr
    paths:
      - '.github/workflows/chimera_dxvk_raw_depth_v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dxvk:
    name: Build DXVK raw scene depth visualizer
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang python python-yaml

      - name: Clone Chimera source and pinned DXVK
        run: |
          git clone --branch chimera-amd-nr --single-branch https://github.com/doubledd1403-hue/OptiScaler_DLSSNR.git chimera-source
          git clone https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git checkout d7ac2580aa274a14a500e74edbe4ec6aae250e4a
          git submodule update --init --recursive

      - name: Reuse V1 renderer probe
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('chimera-source/.github/workflows/chimera_dxvk_probe_v1.yml').read_text())
          step = next(s for s in wf['jobs']['build-dxvk']['steps'] if s.get('name') == 'Add Chimera DXVK depth probe')
          Path('/tmp/chimera_v1.sh').write_text(step['run'])
          PY
          cd dxvk
          bash /tmp/chimera_v1.sh

      - name: Reuse V2 heartbeat expansion
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('chimera-source/.github/workflows/chimera_dxvk_probe_v2_fix.yml').read_text())
          step = next(s for s in wf['jobs']['build-dxvk']['steps'] if s.get('name') == 'Expand probe heartbeat and DSV capture paths')
          Path('/tmp/chimera_v2.sh').write_text(step['run'])
          PY
          cd dxvk
          bash /tmp/chimera_v2.sh

      - name: Reuse V4 CreateDepthStencilView enumeration
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('chimera-source/.github/workflows/chimera_dxvk_depth_create_v4.yml').read_text())
          step = next(s for s in wf['jobs']['build-dxvk']['steps'] if s.get('name') == 'Add CreateDepthStencilView enumeration')
          Path('/tmp/chimera_v4.sh').write_text(step['run'])
          PY
          cd dxvk
          bash /tmp/chimera_v4.sh

      - name: Add renderer-side raw depth presentation
        working-directory: dxvk
        run: |
          echo '' | base64 -d > /tmp/chimera_v5_patch.py
          python3 /tmp/chimera_v5_patch.py
          grep -n 'chimeraRegisterDepthCandidate' src/d3d11/d3d11_device.cpp
          grep -n 'chimeraFindBestSceneDepth' src/d3d11/d3d11_swapchain.cpp
          grep -n 'Chimera v5 raw-depth diagnostic' src/d3d11/d3d11_swapchain.cpp

      - name: Build DXVK x64 and x32
        working-directory: dxvk
        run: |
          export VERSION_NAME="chimera-dxvk-raw-depth-v5"
          ./package-release.sh "" build --no-package

      - name: Verify and package runtime
        working-directory: dxvk
        run: |
          set -euxo pipefail
          root="build/dxvk-chimera-dxvk-raw-depth-v5"
          test -f "/x64/d3d11.dll"
          test -f "/x64/dxgi.dll"
          test -f "/x32/d3d11.dll"
          test -f "/x32/dxgi.dll"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/dxvk-chimera-dxvk-raw-depth-v5/x64/d3d11.dll')
          data = p.read_bytes()
          for marker in (b'CHIMERA_DXVK_PROBE_V1', b'CHIMERA_DSV_CREATE_V1'):
              if marker not in data:
                  raise SystemExit(f'Missing binary marker: {marker!r}')
          print('Inherited probe marker verification: PASS')
          PY
          mkdir -p ../runtime_bundle
          cp "/x64/d3d11.dll" ../runtime_bundle/d3d11_64.dll
          cp "/x64/dxgi.dll"  ../runtime_bundle/dxgi_64.dll
          cp "/x32/d3d11.dll" ../runtime_bundle/d3d11_32.dll
          cp "/x32/dxgi.dll"  ../runtime_bundle/dxgi_32.dll
          cp LICENSE ../runtime_bundle/DXVK-LICENSE
          sha256sum ../runtime_bundle/*.dll

      - name: Upload DXVK runtime
        uses: actions/upload-artifact@v7
        with:
          name: chimera-dxvk-raw-depth-v5-runtime
          path: runtime_bundle
          compression-level: 0
          if-no-files-found: error
