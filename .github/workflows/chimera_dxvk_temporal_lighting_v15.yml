name: Chimera DXVK V15 Temporal Lighting Foundation

on:
  push:
    branches:
      - chimera-amd-nr
    paths:
      - '.github/workflows/chimera_dxvk_temporal_lighting_v15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dxvk:
    name: Build Chimera V15 temporal lighting foundation
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang python python-yaml gzip

      - name: Clone Chimera source and pinned DXVK
        run: |
          git clone --branch chimera-amd-nr --single-branch https://github.com/doubledd1403-hue/OptiScaler_DLSSNR.git chimera-source
          git clone https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git checkout d7ac2580aa274a14a500e74edbe4ec6aae250e4a
          git submodule update --init --recursive

      - name: Reuse proven V1 through V13.1 chain
        run: |
          python3 - <<'PYIN'
          import yaml
          from pathlib import Path
          wf = yaml.safe_load(
              Path('chimera-source/.github/workflows/chimera_dxvk_reconstruction_shadows_v13_1.yml').read_text())
          job = next(iter(wf['jobs'].values()))
          for step_name, out_path in [
              ('Reuse proven V1 through V13 chain', '/tmp/v15_inherit_v13.sh'),
              ('Add V13.1 reconstruction and contact-shadow foundation', '/tmp/v15_inherit_v131.sh'),
          ]:
              step = next(s for s in job['steps'] if s.get('name') == step_name)
              Path(out_path).write_text(step['run'])
          PYIN
          bash /tmp/v15_inherit_v13.sh
          (cd dxvk && bash /tmp/v15_inherit_v131.sh)
          grep -q 'CHIMERA_DEPTH_STABILITY_V12_1' dxvk/src/d3d11/d3d11_context.cpp
          grep -q 'CHIMERA_LIGHTING_V13_1_RECON_SHADOWS' dxvk/src/dxvk/shaders/dxvk_present_common.glsl

      - name: Add V15 persistent temporal lighting history
        working-directory: dxvk
        run: |
          echo '' | base64 -d | gzip -d > /tmp/chimera_v15_temporal_patch.py
          python3 /tmp/chimera_v15_temporal_patch.py
          grep -n 'CHIMERA_LIGHTING_V15_TEMPORAL_HISTORY' src/dxvk/shaders/dxvk_present_common.glsl
          grep -n 'prepareChimeraTemporalHistory' src/dxvk/dxvk_swapchain_blitter.cpp
          grep -n 's_chimera_history_out' src/dxvk/shaders/dxvk_present_common.glsl

      - name: Build DXVK x64 and x32
        working-directory: dxvk
        run: |
          export VERSION_NAME="chimera-dxvk-temporal-lighting-v15"
          ./package-release.sh "$VERSION_NAME" build --no-package

      - name: Verify and package runtime
        working-directory: dxvk
        run: |
          set -euxo pipefail
          root="build/dxvk-chimera-dxvk-temporal-lighting-v15"
          test -f "$root/x64/d3d11.dll"
          test -f "$root/x64/dxgi.dll"
          test -f "$root/x32/d3d11.dll"
          test -f "$root/x32/dxgi.dll"
          grep -q 'CHIMERA_LIGHTING_V15_TEMPORAL_HISTORY' src/dxvk/shaders/dxvk_present_common.glsl
          grep -q 'VK_FORMAT_R16G16B16A16_SFLOAT' src/dxvk/dxvk_swapchain_blitter.cpp
          grep -q 'VK_DESCRIPTOR_TYPE_STORAGE_IMAGE' src/dxvk/dxvk_swapchain_blitter.cpp
          mkdir -p ../runtime_bundle
          cp "$root/x64/d3d11.dll" ../runtime_bundle/d3d11_64.dll
          cp "$root/x64/dxgi.dll"  ../runtime_bundle/dxgi_64.dll
          cp "$root/x32/d3d11.dll" ../runtime_bundle/d3d11_32.dll
          cp "$root/x32/dxgi.dll"  ../runtime_bundle/dxgi_32.dll
          cp LICENSE ../runtime_bundle/DXVK-LICENSE
          sha256sum ../runtime_bundle/*.dll

      - name: Upload DXVK runtime
        uses: actions/upload-artifact@v7
        with:
          name: chimera-dxvk-temporal-lighting-v15-runtime
          path: runtime_bundle
          compression-level: 0
          if-no-files-found: error
