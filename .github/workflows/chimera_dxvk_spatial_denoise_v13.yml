name: Chimera DXVK V13 Spatial Radiance Denoise

on:
  push:
    branches:
      - chimera-amd-nr
    paths:
      - '.github/workflows/chimera_dxvk_spatial_denoise_v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dxvk:
    name: Build Chimera V13 spatial radiance denoise
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang python python-yaml

      - name: Clone Chimera source and pinned DXVK
        run: |
          git clone --branch chimera-amd-nr --single-branch https://github.com/doubledd1403-hue/OptiScaler_DLSSNR.git chimera-source
          git clone https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git checkout d7ac2580aa274a14a500e74edbe4ec6aae250e4a
          git submodule update --init --recursive

      - name: Reuse proven V1 through V12.1 FIX2 chain
        run: |
          python3 - <<'PYIN'
          import yaml
          from pathlib import Path

          wf = yaml.safe_load(
              Path('chimera-source/.github/workflows/chimera_dxvk_projection_stability_v12_1_fix2.yml').read_text())
          job = next(iter(wf['jobs'].values()))

          names = {
            'base': 'Reuse proven V1 through V12 FIX4 chain safely',
            'v121': 'Apply V12.1 projection-stability patch',
          }
          paths = {
            'base': Path('/tmp/v13_inherit_v12.sh'),
            'v121': Path('/tmp/v13_inherit_v121.sh'),
          }

          for key, step_name in names.items():
              step = next(s for s in job['steps'] if s.get('name') == step_name)
              paths[key].write_text(step['run'])
          PYIN

          bash /tmp/v13_inherit_v12.sh
          bash /tmp/v13_inherit_v121.sh

          grep -q 'CHIMERA_DEPTH_FOUNDATION_V12' dxvk/src/d3d11/d3d11_context.cpp
          grep -q 'CHIMERA_DEPTH_STABILITY_V12_1' dxvk/src/d3d11/d3d11_context.cpp
          grep -q 'CHIMERA_LIGHTING_V11_2_COMPOSITE_VISIBILITY' dxvk/src/dxvk/shaders/dxvk_present_common.glsl

      - name: Add V13 depth-aware spatial radiance denoise
        working-directory: dxvk
        run: |
          echo '' | base64 -d > /tmp/chimera_v13_patch.py
          python3 /tmp/chimera_v13_patch.py

          grep -n 'CHIMERA_LIGHTING_V13_SPATIAL_RADIANCE_DENOISE' src/dxvk/shaders/dxvk_present_common.glsl
          grep -n 'chimera_filtered_hit_colour_v13' src/dxvk/shaders/dxvk_present_common.glsl
          grep -n 'chimera_ign_v13' src/dxvk/shaders/dxvk_present_common.glsl

      - name: Build DXVK x64 and x32
        working-directory: dxvk
        run: |
          export VERSION_NAME="chimera-dxvk-spatial-denoise-v13"
          ./package-release.sh "$VERSION_NAME" build --no-package

      - name: Verify and package runtime
        working-directory: dxvk
        run: |
          set -euxo pipefail
          root="build/dxvk-chimera-dxvk-spatial-denoise-v13"
          test -f "$root/x64/d3d11.dll"
          test -f "$root/x64/dxgi.dll"
          test -f "$root/x32/d3d11.dll"
          test -f "$root/x32/dxgi.dll"

          grep -q 'CHIMERA_LIGHTING_V13_SPATIAL_RADIANCE_DENOISE' src/dxvk/shaders/dxvk_present_common.glsl
          grep -q 'chimera_depth_to_view_z_v12' src/dxvk/shaders/dxvk_present_common.glsl
          grep -q 'chimera_filtered_hit_colour_v13' src/dxvk/shaders/dxvk_present_common.glsl

          mkdir -p ../runtime_bundle
          cp "$root/x64/d3d11.dll" ../runtime_bundle/d3d11_64.dll
          cp "$root/x64/dxgi.dll"  ../runtime_bundle/dxgi_64.dll
          cp "$root/x32/d3d11.dll" ../runtime_bundle/d3d11_32.dll
          cp "$root/x32/dxgi.dll"  ../runtime_bundle/dxgi_32.dll
          cp LICENSE ../runtime_bundle/DXVK-LICENSE
          sha256sum ../runtime_bundle/*.dll

      - name: Upload DXVK runtime
        uses: actions/upload-artifact@v7
        with:
          name: chimera-dxvk-spatial-denoise-v13-runtime
          path: runtime_bundle
          compression-level: 0
          if-no-files-found: error
